<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mamostayan / 40-scene visual index</title><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/presentation.css"><link rel="stylesheet" href="css/atlas.css"><style>html,body{height:auto;overflow:auto;background:#13241c;color:#f4f1e9}.overview-item{text-decoration:none}.scene{pointer-events:none}.overview-content{max-width:1900px;margin:auto}.overview-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}.overview-image{color:#13241c}.overview-label{font-size:16px}header{padding:40px 30px 20px;max-width:1900px;margin:auto}header h1{font:700 64px Display;margin:12px 0}header p{font-size:20px;opacity:.7}.home-link{display:inline-block;margin-top:20px;font:14px Technical;color:#d46b48}body .plan-trace path{stroke-dashoffset:0}</style><script defer src="js/presentation-data.js"></script><script defer src="js/slides.js"></script><script defer src="js/atlas.js"></script></head><body><header><div class="eyebrow">MAMOSTAYAN / URBAN ATLAS</div><h1>The complete presentation.</h1><p>Forty redesigned scenes. Select any scene to launch the presentation at that point.</p><a class="home-link" href="index.html">START FROM THE COVER ↗</a></header><main class="overview-content"><div id="preview-grid" class="overview-grid"></div></main><script>window.addEventListener('DOMContentLoaded',()=>{const S=window.Slides,g=document.getElementById('preview-grid');g.innerHTML=S.titles.map((t,i)=>'<a class="overview-item" href="index.html#scene-'+S.pad(i+1)+'"><div class="overview-image" inert>'+S.render(i+1,true)+'</div><span class="overview-label"><em>'+S.pad(i+1)+'</em>'+S.escape(t)+'</span></a>').join('');const fit=()=>{document.querySelectorAll('.overview-image').forEach(el=>el.style.setProperty('--thumb-scale',el.clientWidth/1920));S.fitImages();};fit();window.addEventListener('resize',fit);document.fonts.ready.then(fit);});</script></body></html>
